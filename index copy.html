<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu nuevo hogar</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fff; }
main { padding: clamp(16px, 4vw, 64px); }
.section {
  font-family: ui-sans-serif, system-ui, sans-serif;
  position: relative;
  isolation: isolate;
  display: grid;
  place-items: center;
  max-width: 1280px;
  min-height: 550px;
  margin-inline: auto;
  padding: 48px clamp(16px, 5vw, 48px);
  border-radius: 24px;
  overflow: hidden;
  background: #363a36;
  color: white;
  text-align: center;
}
.section::before, video { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
video { z-index: -2; object-fit: cover; object-position: center; }
.section::before { content: ''; z-index: -1; background: rgb(0 0 0 / 40%); }
.content { width: min(100%, 520px); }
h1 { margin: 0; font-size: 40px; font-weight: 500; line-height: 1.1; letter-spacing: -.035em; }
p { max-width: 400px; margin: 18px auto 26px; font-size: 15px; line-height: 1.6; }
form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px;
  width: min(100%, 470px);
  margin-inline: auto;
  padding: 6px;
  border-radius: 99px;
  background: white;
}
input, button { min-width: 0; min-height: 46px; border: 0; border-radius: 99px; font: inherit; }
input { width: 100%; padding: 0 15px; color: #171717; background: white; font-size: 16px; }
input::placeholder { color: #626262; }
button { padding: 8px 18px; background: #101010; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
button:hover { background: #333; }
input:focus-visible { outline: 2px solid #222; outline-offset: -2px; }
button:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (max-width: 767px) { h1 { font-size: 30px; } }
@media (max-width: 540px) {
  form { grid-template-columns: minmax(0, 1fr); border-radius: 28px; }
}
@media (prefers-reduced-motion: no-preference) {
  .content > * { animation: reveal .65s ease-out both; }
  .content > p { animation-delay: .12s; }
  .content > form { animation-delay: .24s; }
  @keyframes reveal { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
}
</style>
</head>
<body>
<main>
  <section class="section" aria-labelledby="heading">
    <video src="https://media.dinamosites.com/library/v1/sections/own-house-loop-5ca9d3837e61.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
    <div class="content">
      <h1 id="heading">Tu nuevo hogar<br>puede estar cerca.</h1>
      <p>Encuentra una propiedad que se ajuste a lo que buscas. Te acompañamos durante la búsqueda para ayudarte a elegir tu próximo hogar.</p>
      <form>
        <label class="sr-only" for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="email" placeholder="Correo electrónico" required>
        <button type="submit">Quiero recibir novedades</button>
      </form>
    </div>
  </section>
</main>
<script>
const video = document.querySelector('video');
const motion = matchMedia('(prefers-reduced-motion: reduce)');
let onScreen = true;

function updatePlayback() {
  const shouldPlay = onScreen && !document.hidden && !motion.matches;
  if (shouldPlay) video.play().catch(() => {});
  else video.pause();
}

updatePlayback();
new IntersectionObserver(([entry]) => {
  onScreen = entry.isIntersecting;
  updatePlayback();
}).observe(video);
video.addEventListener('play', () => {
  if (motion.matches || !onScreen || document.hidden) video.pause();
});
motion.addEventListener('change', updatePlayback);
document.addEventListener('visibilitychange', updatePlayback);
document.querySelector('form').addEventListener('submit', event => event.preventDefault());
</script>
</body>
</html>
